name: build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

env:
  PIECE: waservix
  AP_REF: bbeb3f0669cdab1ad7c795f02528fc0d08664a0c

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: ours
      - uses: actions/checkout@v4
        with:
          repository: activepieces/activepieces
          ref: ${{ env.AP_REF }}
          path: ap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Add the piece to the Activepieces workspace
        run: |
          cp -r ours/piece ap/packages/pieces/community/$PIECE
          node ours/ci/prepare.js ap $PIECE
      - name: Install
        working-directory: ap
        run: bun install
      - name: Lint
        working-directory: ap
        run: npx turbo run lint --filter=$(node -p "require('./packages/pieces/community/$PIECE/package.json').name")
      - name: Build and pack
        working-directory: ap
        run: npm run build-piece $PIECE
      - name: Smoke test the packed bundle
        run: |
          TGZ=$(ls ap/packages/pieces/community/$PIECE/dist/*.tgz)
          mkdir -p /tmp/pkg && tar -xzf "$TGZ" -C /tmp/pkg
          ls -R /tmp/pkg | head -40
          cat /tmp/pkg/package/package.json
          node ours/ci/smoke.js /tmp/pkg/package
      - uses: actions/upload-artifact@v4
        with:
          name: piece-tgz
          path: ap/packages/pieces/community/${{ env.PIECE }}/dist/*.tgz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: piece-tgz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish ./*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
